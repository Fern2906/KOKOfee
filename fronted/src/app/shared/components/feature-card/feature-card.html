<div class="card hover-3d bg-base-100 w-96 transform-gpu transition-all">
  <div class="h-full pointer-events-none p-4 flex flex-col justify-between">
    <figure class="m-0 border-2 border-base-content rounded-2xl overflow-hidden bg-base-300">
      <img src=" " [src]="image" alt="Producto de cafetería" class="w-full h-48 object-cover grayscale-20 contrast-125">
    </figure>
    <!-- Cuerpo de la tarjeta -->
    <div class="card-body px-0 pb-0 pt-4">
      <div class="card-title text-base-content justify-between">
        <span>{{ tittle }}</span>
        <div class="badge badge-secondary border-2 border-base-content font-bold">NEW</div>
      </div>
      <p class="text-base-content/80 text-sm">{{ description }}</p>
      <div class="card-actions justify-end gap-2 pt-2">
        @for (c of category; track $index) {
          <div class="badge badge-outline border-2 border-base-content font-bold">{{ c }}</div>
        }
      </div>
    </div>

  </div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>

</div>
